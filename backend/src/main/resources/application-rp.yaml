assistant:
  interaction:
    # 单次用户文本请求占用交互窗口的兜底超时，单位毫秒。
    user-turn-ttl-ms: 180000
    # 前端 typing 或未来语音 VAD 心跳暂停游戏自动行动的用户活动窗口，输入停止后按该时长恢复，单位毫秒。
    user-activity-ttl-ms: 3000
    # RP 从首个可见响应字符到 API 流结束期间占用交互窗口的兜底超时，单位毫秒。
    rp-speech-ttl-ms: 180000
    wait:
      # 用户说“等等/等一下”后，默认等待多久再由 RP 主动询问是否继续，单位秒。
      default-seconds: 10
      # 等待状态最长保留多久，防止用户离开后游戏自动行动永久停住，单位分钟。
      max-hold-minutes: 30
      # 等待计时到点后直接投递给前端的 RP 询问文本。
      reminder-text: 好了没？
  rp:
    # 是否在 RP 收到每条用户消息时先执行通用指令路由。
    # 路由模型地址、模型名和超时等固定参数写在 InstructionRouterModelConfig 中。
    instruction-router-enabled: true
    proactive:
      # 是否启用 RP 主动发言。
      enabled: true
      # 非游戏状态下静默多久后允许空闲主动发言，单位毫秒。
      idle-threshold-ms: 60000
      # 非游戏状态下两次主动发言之间的最小间隔，单位毫秒。
      speech-cooldown-ms: 30000
      # 游戏状态下静默多久后允许空闲主动发言，单位毫秒。
      game-idle-threshold-ms: 120000
      # 游戏状态下两次空闲主动发言之间的最小间隔，单位毫秒。
      game-speech-cooldown-ms: 120000
      # 游戏状态下主动发言频率预算的滑动窗口时长，单位毫秒。
      game-proactive-rate-window-ms: 10000
      # 任意游戏主动发言窗口内最多允许的发言次数。
      game-proactive-max-speeches-per-window: 2
      # 空闲会话扫描周期，单位毫秒。
      idle-scan-interval-ms: 10000
      # 空闲触发命中后先等待该窗口再生成主动发言，避免和用户刚发来的消息撞车，单位毫秒。
      idle-speech-grace-ms: 5000
      # 非游戏状态下用户长期不回复时，主动发言退避到的最长间隔，单位毫秒。
      non-game-max-idle-interval-ms: 43200000
