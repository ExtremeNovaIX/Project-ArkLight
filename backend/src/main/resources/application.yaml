spring:
  config:
    import:
      # 基础设施默认配置：数据库、H2 控制台和日志级别。
      - optional:classpath:application-infrastructure.yaml
      # 外部基础设施配置优先于 resources 默认值。
      - optional:${arclight.config.uri}application-infrastructure.yaml
      # 模型供应商与模型名称默认配置。
      - optional:classpath:application-ai.yaml
      # 外部模型配置优先于 resources 默认值。
      - optional:${arclight.config.uri}application-ai.yaml
      # 对话记忆、向量索引和 markdown 存储默认配置。
      - optional:classpath:application-memory.yaml
      # 外部记忆配置优先于 resources 默认值。
      - optional:${arclight.config.uri}application-memory.yaml
      # RP 主动表达和表达欲默认配置。
      - optional:classpath:application-rp.yaml
      # 外部 RP 配置优先于 resources 默认值。
      - optional:${arclight.config.uri}application-rp.yaml
      # TTS 外部服务接入默认配置。
      - optional:classpath:application-tts.yaml
      # 外部 TTS 配置优先于 resources 默认值。
      - optional:${arclight.config.uri}application-tts.yaml
      # Web 与 Qt 前端默认设置。
      - optional:classpath:application-frontend.yaml
      # 外部前端配置优先于 resources 默认值。
      - optional:${arclight.config.uri}application-frontend.yaml
      # MCP 与 gamer 默认配置。
      - optional:classpath:application-mcp.yaml
      # 外部 MCP 配置优先于 resources 默认值。
      - optional:${arclight.config.uri}application-mcp.yaml
