assistant:
  mode: api

  api:
    light-model:
      # 轻模型用于 parser/checker 等短 JSON 或低复杂度任务。
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
    heavy-model:
      # 重模型用于 RP/supervisor；留空字段会从 light-model 继承。
      api-key: ${HEAVY_MODEL_API_KEY:}
      base-url: ${HEAVY_MODEL_BASE_URL:}
      model-name: ${HEAVY_MODEL_NAME:deepseek-v4-pro}
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY:}

  # 切到本地模型时，把 mode 改成 local，并按需取消下面几项注释。
  # local:
  #   light-model:
  #     base-url: http://127.0.0.1:1234/v1
  #     model-name: qwen3.6
  #   heavy-model:
  #     base-url: http://127.0.0.1:1234/v1
  #     model-name: qwen3.6
