tts:
  enabled: ${TTS_ENABLED:true}
  # 可选：voxcpm2-http、gpt-sovits-http。
  provider: voxcpm2-http
  # 合成文本约达到多少个非空白字符后，在最近句末标点切段。
  first-chunk-min-chars: 6
  first-chunk-chars: 12
  max-chunk-chars: 40

  gpt-so-vits:
    base-url: ${GPT_SOVITS_BASE_URL:http://127.0.0.1:9880}
    ref-audio-path: ${GPT_SOVITS_REF_AUDIO_PATH:}
    aux-ref-audio-paths: []
    prompt-text: ${GPT_SOVITS_PROMPT_TEXT:}
    text-lang: zh
    prompt-lang: zh
    media-type: wav
    text-split-method: cut0
    top-k: 15
    top-p: 1.0
    temperature: 1.0
    batch-size: 4
    batch-threshold: 0.75
    split-bucket: true
    speed-factor: 1.0
    fragment-interval: 0.08
    seed: -1
    streaming-mode: 0
    parallel-infer: true
    repetition-penalty: 1.35
    sample-steps: 32
    super-sampling: false
    overlap-length: 2
    min-chunk-length: 16

  vox-cpm2:
    base-url: ${VOXCPM2_BASE_URL:http://127.0.0.1:8810}
    reference-wav-path: ${VOXCPM2_REFERENCE_WAV_PATH:}
    prompt-text: ${VOXCPM2_PROMPT_TEXT:}
    cfg-value: 2.0
    inference-timesteps: 10
    normalize: true
    denoise: false
    media-type: wav
    streaming-enabled: true
    badcase-retry-attempts: 1
