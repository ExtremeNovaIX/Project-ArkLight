mcp:
  # Directory scanned for MCP server manifests.
  servers-directory: ../mcp-servers
  # Local registry file used by the simple MCP registry path.
  registry-file: config/mcp-registry.json
  client:
    tool-timeout-seconds: 120
    max-connections: 4

game:
  default-game-name: ""
  default-session-id: default
  client-name: ArcLight-GameAgent
  client-version: "1.0"
  loop:
    poll-interval-ms: 500
    slow-observe:
      enabled: true
      threshold: 2
      initial-ms: 1000
      step-ms: 1000
      max-ms: 3000
  trace:
    trace-enabled: true
    trace-directory: data/game-traces
