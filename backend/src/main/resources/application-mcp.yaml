mcp:
  # MCP server 自动发现目录。
  servers-directory: ${MCP_SERVERS_DIR:../mcp-servers}
  # MCP server 注册表文件位置。
  registry-file: ${MCP_REGISTRY_FILE:config/mcp-registry.json}
  client:
    # 单次 MCP 工具调用超时时间，单位秒。
    tool-timeout-seconds: 120
    # MCP 客户端允许同时保留的连接数。
    max-connections: 4

gamer:
  # 请求未显式指定游戏时使用的默认游戏名。
  default-game-name: ${GAMER_DEFAULT_GAME:}
  # 请求未显式指定 session 时使用的默认 gamer session。
  default-session-id: ${GAMER_DEFAULT_SESSION:default}
  # gamer 连接 MCP 时上报的客户端名称。
  client-name: ${GAMER_MCP_CLIENT_NAME:ArcLight-GameAgent}
  # gamer 连接 MCP 时上报的客户端版本。
  client-version: ${GAMER_MCP_CLIENT_VERSION:1.0}
  game-loop:
    # gamer 定时轮询当前是否可行动的间隔，单位毫秒。
    poll-interval-ms: 500
    # 队列被状态变化打断后，单次 tick 内允许立即重规划的次数。
    max-immediate-replans: 5
    slow-observe:
      # 是否启用无有效动作时的慢观察退避，用于多人等待队友或敌方回合时减少空转。
      enabled: true
      # 连续多少次没有有效动作后开始放慢单会话观察频率。
      threshold: 2
      # 首次慢观察间隔，单位毫秒。
      initial-ms: 1000
      # 每次继续无有效动作时增加的观察间隔，单位毫秒。
      step-ms: 1000
      # 慢观察最大间隔，单位毫秒。
      max-ms: 3000
  streaming:
    # 单次模型 stream 内最多接受多少个 ACTION。
    max-actions-per-stream: 12
    # 单次模型 stream 最长等待时间，单位毫秒。
    max-stream-wait-ms: 30000
    # 首个 ACTION 到达前允许等待的最长时间，单位毫秒。
    first-action-timeout-ms: 12000
    # 单个 JSON 候选片段最大字符数，超过后丢弃该候选。
    max-json-candidate-chars: 12000
    # 写入 gamer 复盘跟踪时保留的 reasoning 最大字符数。
    reasoning-trace-max-chars: 4000
    # 是否从 thinking/reasoning_content 流中解析 ACTION。
    parse-thinking-chunks: false
    # 是否从普通 response 流中解析 ACTION。
    parse-response-chunks: true
    # 单次 gamer stream 结束后是否打印汇总日志。
    log-stream-summary: true
    # 汇总日志中 thinking/response 各自最多保留的字符数。
    log-summary-max-chars: 6000
  memory:
    # gamer 工作记忆中保留的最近决策条数。
    recent-decision-limit: 48
    # 每累计多少次决策压缩一次阶段摘要。
    stage-compress-decision-interval: 48
    # 每累计多少个阶段摘要压缩一次 run 摘要。
    run-compress-stage-interval: 10
    # 是否写 gamer 行动复盘 markdown。
    trace-enabled: true
    # gamer 行动复盘 markdown 输出目录。
    trace-directory: data/gamer-traces
