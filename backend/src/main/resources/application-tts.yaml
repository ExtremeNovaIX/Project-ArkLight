tts:
  enabled: true
  provider: gpt-sovits-http
  synthesis-timeout-ms: 60000
  first-chunk-min-chars: 6
  first-chunk-chars: 12
  max-chunk-chars: 40
  sentence-end-marks:
    - "。"
    - "，"
    - "！"
    - "？"
    - "；"
    - "."
    - "!"
    - "?"
    - ";"
    - "\n"

  gpt-so-vits:
    base-url: http://127.0.0.1:9880
    ref-audio-path: ""
    prompt-text: ""
    text-lang: zh
    prompt-lang: zh
    media-type: wav
    speed-factor: 1.0
    top-k: 15
    top-p: 1.0
    temperature: 1.0
    seed: -1
    # text-split-method: cut0
    # batch-size: 4
    # batch-threshold: 0.75
    # split-bucket: true
    # fragment-interval: 0.08
    # streaming-mode: 0
    # parallel-infer: true
    # repetition-penalty: 1.35
    # sample-steps: 32
    # super-sampling: false
    # overlap-length: 2
    # min-chunk-length: 16
    # aux-ref-audio-paths: []

  runtime:
    auto-start-enabled: true
    startup-command:
      - cmd
      - /c
      - runtime\python.exe api_v2.py -a 127.0.0.1 -p 9880 -c GPT_SoVITS/configs/tts_infer.yaml
    working-directory: tts/runtime/GPT-SoVITS-v2pro
    bind-address: 127.0.0.1
    port: 9880
    health-path: /docs
    log-file-path: gpt-sovits-server.log
    startup-wait-ms: 1000
    max-restart-attempts: 1
    # launcher-command:
    #   - uv
    #   - run
    #   - python
    # python-executable: ""
    # api-server-script: api_v2.py
    # tts-config-path: GPT_SoVITS/configs/tts_infer.yaml
    # extra-args: []
    # environment: {}
