assistant:
  # api uses remote OpenAI-compatible services; local uses local OpenAI-compatible services.
  mode: api

  api:
    light-model:
      api-key: ""
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
      timeout-seconds: 300
      log-enabled: false
      return-thinking: true
      send-thinking: true
      reasoning-effort: ""
      thinking-type: enabled
    heavy-model:
      # Blank fields inherit from light-model through AssistantProperties.
      api-key: ""
      base-url: ""
      model-name: deepseek-v4-pro
      timeout-seconds: 300
      log-enabled: false
      return-thinking: true
      send-thinking: true
      reasoning-effort: low
      thinking-type: enabled
    embedding-model:
      api-key: ""
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: text-embedding-v3

  local:
    light-model:
      base-url: http://127.0.0.1:1234/v1
      model-name: qwen3.6
      timeout-seconds: 600
      log-enabled: false
      return-thinking: true
      send-thinking: true
      reasoning-effort: ""
      thinking-type: enabled
    heavy-model:
      base-url: ""
      model-name: ""
      timeout-seconds: 600
      log-enabled: false
      return-thinking: true
      send-thinking: true
      reasoning-effort: low
      thinking-type: enabled
    embedding-model:
      base-url: http://127.0.0.1:1234/v1
      model-name: text-embedding-embedding
