mcp:
  catalog:
    STS2MCP:
      # 在前端或日志中展示的 MCP 游戏名。
      display-name: "杀戮尖塔2"
      # MCP 条目用途和安装前提说明。
      description: "杀戮尖塔2 MCP Mod。需要先安装 STS2_MCP.dll 到游戏 mods 目录，并确保 uv 已安装。"
      # MCP 连接方式。
      transport: stdio
      # 该游戏使用的 GameAdapter id。
      adapter: sts2
      # 读取当前游戏状态的 MCP 工具名。
      state-tool-name: get_game_state
      # 读取状态后等待状态稳定的最大重试次数。
      state-settle-max-attempts: 4
      # 状态稳定重读之间的等待时间，单位毫秒。
      state-settle-delay-ms: 250
      # 启动 MCP server 的命令。
      command: "uv"
      # 启动 MCP server 的命令参数，installPath 会在安装目录解析后替换。
      args: ["run", "--directory", "{{installPath}}", "python", "server.py"]
      # MCP server 建连超时时间，单位秒。
      connect-timeout-seconds: 30
      # 注入给 RP 当前游戏上下文 tips 块的提示。
      tips:
        - 场上大部分buff每回合减少一层（如虚弱，易伤）;在没有特殊buff的情况下，进入新的回合时格挡清零，能量回复至上限，手牌放入弃牌堆并且重新抽取。
        - 杀戮尖塔使用向下取整算数，比如敌方原本打15，被挂虚弱(减少地方25%伤害)之后变为15*0.75=11。
        - 当敌人没有攻击意图时是你是输出、成长（打出能力牌）的好时机。
        - 抽牌、弃牌、随机、领取奖励、打开选择界面等会改变行动窗口的操作必须放在本批队列末尾；触发状态变化后后台会中断剩余队列并要求重新计划。
